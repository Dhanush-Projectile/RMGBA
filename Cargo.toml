[package]
name = "rmgba"
version = "0.1.0"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
mgba-sys = { path = "mgba-rs/mgba-sys" }
mgba = { path = "mgba-rs/mgba" }
cpal = "0.18.2"
ringbuf = "0.5.1"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
